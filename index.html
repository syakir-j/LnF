<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kiosk Video Loop</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
            z-index: 1;
        }
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>

    <video 
        id="kiosk-video"
        controls 
        loop 
        autoplay 
        muted
        playsinline
        webkit-playsinline>
        <!-- Updated direct release asset URL -->
        <source src="https://github.com/syakir-j/LnF/releases/download/v1/video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('kiosk-video');
        video.volume = 1.0;
        window.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }
        }, { once: true });
    </script>

</body>
</html>
