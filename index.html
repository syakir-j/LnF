<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosk Video Player</title>
    <style>
        /* Establish full display layout framework edge to edge */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Prevent frame compression boxes or side borders completely */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>

    <!-- 
      - The absolute raw stream reference file.
      - Autoplay and muted are locked to bypass standard browser security engines instantly.
    -->
    <video 
        id="kiosk-video"
        controls 
        loop 
        autoplay 
        muted
        playsinline
        webkit-playsinline>
        <source src="https://googleapis.com" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('kiosk-video');
        video.volume = 1.0;

        // Force audio unmute profile the moment a user interacts anywhere on the player interface
        window.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }
        }, { once: true });
    </script>

</body>
</html>
