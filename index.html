<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kiosk Video Loop</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
            z-index: 1;
        }
        /* Full-width bottom overlay container */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 15px 20px calc(15px + env(safe-area-inset-bottom)) 20px;
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
        }
        .time-row {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 500;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .kiosk-btn {
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: 10px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease;
        }
        .kiosk-btn:active {
            background-color: rgba(255, 255, 255, 0.3);
        }
        /* Custom Seek Bar Style */
        #seek-bar {
            flex-grow: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        #seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video 
            id="kiosk-video"
            loop 
            autoplay 
            muted
            playsinline
            webkit-playsinline>
            <source src="https://github.com/syakir-j/LnF/releases/download/v1/video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Bottom Controls Overlay -->
        <div class="controls-overlay">
            <div class="time-row">
                <span id="current-time">0:00</span>
                <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
                <span id="duration">0:00</span>
            </div>
            <div class="button-group">
                <button id="rewind-btn" class="kiosk-btn">-10s</button>
                <button id="play-btn" class="kiosk-btn">Pause</button>
                <button id="forward-btn" class="kiosk-btn">+10s</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('kiosk-video');
        const playBtn = document.getElementById('play-btn');
        const rewindBtn = document.getElementById('rewind-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const seekBar = document.getElementById('seek-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');

        // Format seconds into M:SS
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Global gesture zoom prevention
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
            document.addEventListener(type, function (e) {
                e.preventDefault();
            }, { passive: false });
        });

        document.addEventListener('touchmove', function (e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // Metadata loaded: set seek bar max and duration text
        video.addEventListener('loadedmetadata', () => {
            seekBar.max = video.duration;
            durationEl.textContent = formatTime(video.duration);
        });

        // Update seek bar and current timestamp during playback
        let isSeeking = false;
        video.addEventListener('timeupdate', () => {
            if (!isSeeking) {
                seekBar.value = video.currentTime;
                currentTimeEl.textContent = formatTime(video.currentTime);
            }
        });

        // Scrubbing events
        seekBar.addEventListener('input', () => {
            isSeeking = true;
            video.currentTime = seekBar.value;
            currentTimeEl.textContent = formatTime(video.currentTime);
        });

        seekBar.addEventListener('change', () => {
            isSeeking = false;
            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }
        });

        // Play/Pause toggle logic
        playBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playBtn.textContent = "Pause";
            } else {
                video.pause();
                playBtn.textContent = "Play";
            }

            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }
        });

        // Rewind 10 seconds
        rewindBtn.addEventListener('click', () => {
            video.currentTime = Math.max(0, video.currentTime - 10);
            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }
        });

        // Forward 10 seconds
        forwardBtn.addEventListener('click', () => {
            video.currentTime = Math.min(video.duration, video.currentTime + 10);
            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }
        });

        // Backup loop enforcement
        video.addEventListener('ended', () => {
            video.currentTime = 0;
            video.play().catch(err => console.log("Autoplay prevented:", err));
        });
    </script>

</body>
</html>
