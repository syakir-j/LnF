<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kiosk Video Loop</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
            z-index: 1;
        }
        .touch-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: transparent;
            pointer-events: none;
            touch-action: none;
        }
        
        /* Hides WebKit AirPlay and PiP controls */
        video::-webkit-media-controls-airplay-button,
        video::-webkit-media-controls-picture-in-picture-button {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video 
            id="kiosk-video"
            controls 
            loop 
            autoplay 
            muted
            playsinline
            webkit-playsinline
            disablePictureInPicture
            x-webkit-airplay="deny">
            <source src="https://github.com/syakir-j/LnF/releases/download/v1/video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="touch-shield" id="touchShield"></div>
    </div>

    <script>
        const video = document.getElementById('kiosk-video');

        // Prevent pinch-to-zoom globally
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        document.addEventListener('touchmove', function (e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // Unmute audio on first user touch/click
        window.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }
        }, { once: true });

        // Backup loop enforcement
        video.addEventListener('ended', () => {
            video.currentTime = 0;
            video.play().catch(err => console.log("Autoplay prevented:", err));
        });
    </script>

</body>
</html>
